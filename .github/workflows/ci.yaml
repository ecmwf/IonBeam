name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  determine-version:
    if: github.event_name == 'pull_request' || github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            BASE=$(git describe --tags --match '[0-9]*' --abbrev=0 2>/dev/null || echo "0.0.0")
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1)).dev${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: |
          uv sync --frozen --all-packages --group dev
          uv run --no-sync pytest

  build-docker-images:
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        include:
          - component: ionbeam
            dockerfile: Dockerfile
            target: ionbeam
          - component: data-sources
            dockerfile: Dockerfile
            target: data-sources
          - component: ecmwf-exporter
            dockerfile: Dockerfile
            target: ecmwf-exporter
          - component: pygeoapi-server
            dockerfile: Dockerfile.pygeoapi
            target: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: eccr.ecmwf.int/ionbeam-next/${{ matrix.component }}:${{ needs.determine-version.outputs.version }}
          build-args: |
            VERSION=${{ needs.determine-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  image-summary:
    if: github.event_name == 'pull_request'
    needs: [determine-version, build-docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Find existing artifacts comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '### Build Artifacts'
      - name: Comment image tags on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### Build Artifacts
            ```
            docker pull eccr.ecmwf.int/ionbeam-next/ionbeam:${{ needs.determine-version.outputs.version }}
            docker pull eccr.ecmwf.int/ionbeam-next/data-sources:${{ needs.determine-version.outputs.version }}
            docker pull eccr.ecmwf.int/ionbeam-next/ecmwf-exporter:${{ needs.determine-version.outputs.version }}
            docker pull eccr.ecmwf.int/ionbeam-next/pygeoapi-server:${{ needs.determine-version.outputs.version }}
            ```
            Deploy: set `image.tag: "${{ needs.determine-version.outputs.version }}"` in your local values overlay.
