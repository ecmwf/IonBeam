exporter_name: "odb"

dataset_filter:
  - "netatmo"

ionbeam:
  flight_url: "grpc://localhost:8815"

odb_exporter:
  # A local directory or an S3 prefix; cycles encode via a local temp file and
  # stream to the store, so S3 output needs no persistent volume. S3 reads the
  # standard AWS env for credentials and AWS_ENDPOINT_URL_S3 for the endpoint.
  #   output_path: "s3://ionbeam/odb"
  output_path: "./data/odb"

  # Only datasets declaring variables in these schemes are exported; unset
  # accepts any. The semantics -> varno map itself is code (ecmwf.varno_map),
  # not configuration.
  scheme_filter:
    - "cf"

  # Per-dataset ODB report provenance; an unlisted dataset gets the crowd-AWS
  # defaults (reportype 16090, codetype 179, obstype 1, groupid 17).
  report_identity: {}

  # A cycle file builds once the analysis cycle has closed plus this margin
  # (the data cutoff) and no new event has touched it for the quiesce period —
  # so a straggler burst or replayed backlog settles first and costs one
  # rebuild, not one per event.
  assembly_cutoff: "PT1H"
  assembly_quiesce: "PT10M"
